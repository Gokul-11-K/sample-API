<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First API</title>
</head>
<body>
    <h2>Save Text to MySQL</h2>

    <input type="text" id="message" placeholder="Enter your text">
    <button onclick="saveText()">Save</button>

    <p id="result"></p>

    <script src="script.js"></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 30px;
        width: 85%;
        max-width: 400px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
        color: #5b4baf;
        margin-bottom: 10px;
    }

    p {
        color: #666;
        font-size: 15px;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
    }

    button {
        background: #667eea;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
    }

    button:hover {
        background: #5145cd;
        transform: translateY(-2px);
    }

    #result {
        margin-top: 20px;
        padding: 12px;
        background: #f3f0ff;
        border-radius: 8px;
        color: #333;
        overflow-wrap: anywhere;
    }
</style>
</body>
</html>
